<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">looks-busy-agent: from approved sources to a private daily report</title>
  <desc id="description">A left-to-right diagram showing individually authorized calendar, email, conversation and files flowing into a local agent skill, then to a private draft and optional reviewed schedule.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f1"/>
      <stop offset="1" stop-color="#eff4f0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#143d36" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="76" r="130" fill="#dbece0" opacity=".5"/>
  <circle cx="75" cy="365" r="150" fill="#f2e9d9" opacity=".5"/>
  <text x="52" y="63" fill="#174c43" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1">LOOKS-BUSY-AGENT</text>
  <text x="52" y="90" fill="#60746e" font-family="Arial, sans-serif" font-size="14">A consent-driven workflow for clearer daily updates</text>

  <g filter="url(#shadow)">
    <rect x="52" y="130" width="255" height="204" rx="18" fill="#fff" stroke="#d9e2db"/>
    <rect x="361" y="130" width="215" height="204" rx="18" fill="#174c43"/>
    <rect x="630" y="130" width="225" height="204" rx="18" fill="#fff" stroke="#d9e2db"/>
    <rect x="909" y="130" width="239" height="204" rx="18" fill="#fff" stroke="#d9e2db"/>
  </g>

  <text x="76" y="170" fill="#174c43" font-family="Arial, sans-serif" font-size="17" font-weight="700">01  Select sources</text>
  <text x="76" y="206" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Calendar · read-only</text>
  <text x="76" y="235" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Email · read-only</text>
  <text x="76" y="264" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Conversation · optional</text>
  <text x="76" y="293" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Files · selected scope</text>

  <text x="385" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">02  Local skill</text>
  <text x="385" y="210" fill="#dceee6" font-family="Arial, sans-serif" font-size="15">Collect evidence</text>
  <text x="385" y="241" fill="#dceee6" font-family="Arial, sans-serif" font-size="15">Synthesize progress</text>
  <text x="385" y="272" fill="#dceee6" font-family="Arial, sans-serif" font-size="15">Keep sources private</text>

  <text x="654" y="170" fill="#174c43" font-family="Arial, sans-serif" font-size="17" font-weight="700">03  Review draft</text>
  <text x="654" y="210" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Today's progress</text>
  <text x="654" y="241" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Next steps</text>
  <text x="654" y="272" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Private delivery</text>

  <text x="933" y="170" fill="#174c43" font-family="Arial, sans-serif" font-size="17" font-weight="700">04  Schedule, if approved</text>
  <text x="933" y="210" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Agent-native or OS fallback</text>
  <text x="933" y="241" fill="#415c54" font-family="Arial, sans-serif" font-size="15">Separate calendar write opt-in</text>
  <text x="933" y="272" fill="#415c54" font-family="Arial, sans-serif" font-size="15">User can revoke access</text>

  <path d="M313 232h37m-12-10 12 10-12 10M582 232h37m-12-10 12 10-12 10M861 232h37m-12-10 12 10-12 10" fill="none" stroke="#7a9f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="373" fill="#60746e" font-family="Arial, sans-serif" font-size="12">Illustrative workflow · no private data shown</text>
</svg>
